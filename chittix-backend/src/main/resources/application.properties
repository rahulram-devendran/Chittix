spring.application.name=company-brain
server.port=${SERVER_PORT:8080}

# FalkorDB connection (override with environment variables)
falkordb.host=${FALKORDB_HOST:localhost}
falkordb.port=${FALKORDB_PORT:6379}
falkordb.graph=${FALKORDB_GRAPH:company_brain}
# Optional auth. Leave empty for the local Docker instance.
falkordb.username=${FALKORDB_USERNAME:}
falkordb.password=${FALKORDB_PASSWORD:}

# Demo endpoint: project-name keyword used by /api/demo/payments-context
brain.demo.project-keyword=${BRAIN_DEMO_PROJECT_KEYWORD:payment}

# FalkorDB Vector Index Configuration (384 for all-MiniLM-L6-v2)
falkordb.vector.dimension=${FALKORDB_VECTOR_DIMENSION:384}
falkordb.vector.similarity-function=${FALKORDB_VECTOR_SIMILARITY_FUNCTION:cosine}
falkordb.vector.index-label=${FALKORDB_VECTOR_INDEX_LABEL:DocumentChunk}
falkordb.vector.index-property=${FALKORDB_VECTOR_INDEX_PROPERTY:embedding}
falkordb.vector.max-distance=0.5

# Text Chunking Configuration
falkordb.chunking.size=${FALKORDB_CHUNKING_SIZE:400}
falkordb.chunking.overlap=${FALKORDB_CHUNKING_OVERLAP:60}

# Multi-Provider LLM Configuration (Default: local Ollama)
chittix.llm.enabled=${CHITTIX_LLM_ENABLED:true}
chittix.llm.provider=${CHITTIX_LLM_PROVIDER:ollama}
chittix.llm.model=${CHITTIX_LLM_MODEL:qwen2.5:1.5b}
chittix.llm.base-url=${CHITTIX_LLM_BASE_URL:http://localhost:11434}
chittix.llm.timeout-seconds=${CHITTIX_LLM_TIMEOUT_SECONDS:60}
chittix.llm.temperature=${CHITTIX_LLM_TEMPERATURE:0.1}
chittix.llm.max-tokens=${CHITTIX_LLM_MAX_TOKENS:500}
chittix.llm.api-key=${CHITTIX_LLM_API_KEY:}

# Provider-Specific Overrides & Externalized Credentials
chittix.llm.openai-api-key=${OPENAI_API_KEY:}
chittix.llm.openai-base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
chittix.llm.openai-model=${OPENAI_MODEL:gpt-4o-mini}

chittix.llm.openai-compatible-api-key=${OPENAI_COMPATIBLE_API_KEY:}
chittix.llm.openai-compatible-base-url=${OPENAI_COMPATIBLE_BASE_URL:http://localhost:8000/v1}
chittix.llm.openai-compatible-model=${OPENAI_COMPATIBLE_MODEL:gpt-4o-mini}

chittix.llm.gemini-api-key=${GEMINI_API_KEY:}
chittix.llm.gemini-base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
chittix.llm.gemini-model=${GEMINI_MODEL:gemini-1.5-flash}

chittix.llm.anthropic-api-key=${ANTHROPIC_API_KEY:}
chittix.llm.anthropic-base-url=${ANTHROPIC_BASE_URL:https://api.anthropic.com}
chittix.llm.anthropic-model=${ANTHROPIC_MODEL:claude-3-5-haiku-20241022}

# GitHub Metadata Ingestion Configuration
chittix.github.token=${GITHUB_TOKEN:}
chittix.github.api-url=${GITHUB_API_URL:https://api.github.com}
chittix.github.commit-limit=${GITHUB_COMMIT_LIMIT:20}
chittix.github.pr-limit=${GITHUB_PR_LIMIT:20}

